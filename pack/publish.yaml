# Publish spec for eval.dearauditor.ch/telemedicine-consultation.
#
# Authored prose only. Every number below is a {{fact}} placeholder that
# `rig publish` resolves from pinned run artifacts — nothing is hand-typed.
# The pack loader ignores this file, so editing it never changes the pack hash.

slug: telemedicine-consultation
title: Telemedicine consultation triage
export_name: telemedicineConsultation
report_title: Validation dossier — telemedicine consultation triage (consultation pack)

summary: >-
  An AI works through a remote consultation — complaint, history, attachments —
  and proposes diagnosis, workup, and treatment. This pipeline grades three
  Gemini generations against gold answers on original synthetic consultation
  cases, and shows what an honest FAIL looks like.

data_note: >-
  Cases are {{pack.n_cases}} original, independently authored synthetic
  consultations. Their design follows the published D.O.T.S. specification
  (arXiv:2603.25821); no data from the Doctorina MedBench dataset is included.

diffs:
  gen25_to_35:
    baseline: 212dc026df469e86 # gemini-2.5-flash, gemini_compare_all battery
    candidate: 77dd40702665cc98 # gemini-3.5-flash, same pinned inputs
  gen35_to_37:
    baseline: 77dd40702665cc98
    candidate: 5c3615f213323163 # gemini-3.7-flash

arc:
  task: |
    <p>In a telemedicine service, the first conversation often decides everything: what the patient is asked, what gets recorded, and whether the case is routed to a doctor now, later, or to self-care. Vendors increasingly put an AI on that first conversation.</p>
    <p>The workflow under test: the model works through a consultation case — presenting complaint, patient history, attached investigations — and produces a clinical assessment with diagnosis, differentials, workup, and first-line treatment.</p>

  risks: |
    <ul>
    <li><strong>Critical omissions</strong> — the one finding that should change the assessment gets summarized away, especially when part of the input is missing or degraded.</li>
    <li><strong>Overconfident answers</strong> — a fluent, plausible assessment on a case where the safe move was escalation.</li>
    <li><strong>Version-to-version drift</strong> — the same vendor's next model release handles the same conversation differently, and nobody measures it.</li>
    </ul>

  measurement: |
    <p>Each case carries gold answers: the clinical facts an assessment must contain and the management that is defensible. A pinned AI judge scores every output against that rubric, under a perturbation grid that withholds or degrades parts of the input. Acceptance thresholds are <strong>pre-registered in the pack</strong> — the pass/fail line is fixed before any model runs, so a failure cannot be negotiated away after the fact.</p>
    <p>Three Gemini generations were run side by side on the same pinned inputs, so the pipeline answers a concrete question: <strong>did the new model get better or worse on your cases?</strong></p>

  findings: |
    <p><strong>The rig failed this workflow — and that is the finding.</strong> On the comparison battery's baseline condition (the intended, unperturbed inputs), {{run.212dc026df469e86.sut}} missed critical findings in {{run.212dc026df469e86.acceptance.critical_omission_rate.value|.1%}} of graded checks. The pre-registered limit is {{run.212dc026df469e86.acceptance.critical_omission_rate.limit|.0%}}. Verdict: <strong>{{run.212dc026df469e86.acceptance.critical_omission_rate.result}}</strong> — even though the same run's mean quality score, {{run.212dc026df469e86.acceptance.mean_score.value|.2f}}, comfortably cleared its own threshold of {{run.212dc026df469e86.acceptance.mean_score.limit|.2f}}. On the input-contract battery, the same model re-graded on the intended inputs recorded {{run.41b30eb55c594cc5.acceptance.critical_omission_rate.value|.0%}} critical omissions and passed; across that battery's full perturbation grid (inputs withheld or degraded), the critical omission rate rose to {{run.41b30eb55c594cc5.critical_omission_rate|.0%}}.</p>
    <p class="caveat"><strong>How much weight this carries:</strong> the case bank holds 10 synthetic cases, so the confidence interval around that omission rate is wide — it spans the limit in both directions, and a single case moving changes the headline. It has: in the previous archived run of this pack lineage the excess omission rate appeared on the contract battery while the comparison baseline passed; on this re-run of identical case content the verdict flipped batteries. A live LLM judge re-grades afresh each run, and a pre-registered gate is a point comparison by design — so each FAIL stands as recorded, and the instability itself is measured and archived rather than averaged away. What a bank this small cannot tell you is how far from the limit the true rate sits. It is a demonstration of the method on a worked example, not a safety verdict on any product.</p>
    <p>That combination is the whole story: a model can look good on average and still be unsafe at the edges. A validation pipeline that cannot say FAIL is marketing; this one just did.</p>
    <p><strong>Model comparison:</strong> on the pinned head-to-head comparison battery, the three Gemini generations scored {{run.212dc026df469e86.mean_score|.3f}} ({{run.212dc026df469e86.sut}}), {{run.77dd40702665cc98.mean_score|.3f}} ({{run.77dd40702665cc98.sut}}), and {{run.5c3615f213323163.mean_score|.3f}} ({{run.5c3615f213323163.sut}}) — the two newer generations passed every acceptance gate, while {{run.212dc026df469e86.sut}} failed its critical-omission gate as above. Mean score deltas across the two version steps: {{diff.gen25_to_35.delta|+.2f}} and {{diff.gen35_to_37.delta|+.2f}}.</p>

  meaning: |
    <p>Triage AI is exactly where "it seemed fine in the demo" is not a safety argument. This workflow crossed a pre-registered safety line on critical omissions, on clean inputs — while the same model, re-graded in a second battery, landed under the line, and the miss rate rose well past it once inputs were degraded. A validation pipeline gives a telemedicine provider that answer as a standing capability: on which cases does it fail, under what conditions, how stable is that verdict, and did the last update change it?</p>
    <p>Because the case bank is synthetic and original, the whole pipeline — cases, rubric, judge prompts — can be published and inspected without touching patient data.</p>
